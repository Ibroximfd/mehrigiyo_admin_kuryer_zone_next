# Avtomatik generatsiya qilingan — QO'LDA TAHRIRLAMANG.
# Manba:  nginx.conf.template
# Server: Production (my.imorganic.uz)
# Buyruq: npm run config:nginx

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Siqish ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm application/octet-stream;

    # Chatdagi video chegarasi 50 MB (STAFF_CHAT_FLUTTER.md §1.3) + multipart
    # qo'shimchasi. Ilgari 25m turgan va katta video shu yerda 413 bilan
    # rad etilardi — Django'ga yetmasdan, HTML sahifa bilan.
    #
    # ⚠️ Bu faqat KONTEYNER nginx'i. Serverdagi front nginx (domenni shu
    # konteynerga uzatadigan, repo'da yo'q) ham `client_max_body_size 52m;`
    # bo'lishi shart — u sukut bo'yicha 1m va 2 MB rasmni ham qaytaradi.
    client_max_body_size 52m;

    # ---- REST API -> backend ----
    location /api/ {
        proxy_pass https://my.imorganic.uz/api/;
        proxy_set_header Host my.imorganic.uz;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ---- Media fayllar -> backend ----
    location /media/ {
        proxy_pass https://my.imorganic.uz/media/;
        proxy_set_header Host my.imorganic.uz;
        proxy_ssl_server_name on;
    }

    # ---- WebSocket -> backend ----
    location /ws {
        proxy_pass https://my.imorganic.uz/ws;
        proxy_set_header Host my.imorganic.uz;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Next.js hash'langan fayllari ----
    # Fayl nomida kontent hashi bor, ya'ni tarkibi o'zgarsa nomi ham
    # o'zgaradi. Shuning uchun ularni bir yilga keshlash butunlay xavfsiz.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Rasm/shrift kabi statik fayllar ----
    location ~* \.(?:png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- SPA: HTML hech qachon keshlanmaydi ----
    # `$uri.html` muhim: `next build` statik eksportda /orders uchun
    # `orders.html` faylini yaratadi.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /404.html;
}
